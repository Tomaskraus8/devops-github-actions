name: CI Pipeline
run-name: ${{ github.actor }} is testing PHP application 🧪
on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository code
              uses: actions/checkout@v5

            - name: Setup PHP 8.4
              run: |
                  sudo apt-get update
                  sudo apt-get install -y software-properties-common
                  sudo add-apt-repository ppa:ondrej/php -y
                  sudo apt-get update
                  sudo apt-get install -y php8.4-cli php8.4-mbstring php8.4-xml php8.4-curl php8.4-zip
                  php -v

            - name: Install Composer
              run: |
                  curl -sS https://getcomposer.org/installer | php
                  sudo mv composer.phar /usr/local/bin/composer
                  composer --version

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Run PHP syntax check
              run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

            - name: Run PHPUnit tests
              run: composer test

            - name: Report test completion
              run: echo "✅ All tests passed successfully!"
    publish:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/develop'
        permissions:
            packages: write
            contents: read

        steps:
            - name: Checkout repository code
              uses: actions/checkout@v5

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/tomaskraus8/calculator:latest